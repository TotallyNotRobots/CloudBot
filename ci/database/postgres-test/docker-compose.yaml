services:
  database:
    image: 'postgres:18@sha256:f5cbc081c25690710f3fc6f4c61a7565382bae01ca0d0f2028a53d7926b85a20'
    ports:
    - 15432:5432
    env_file:
    - .env
    networks:
    - postgres-network
    volumes:
    - database:/var/lib/postgresql/data/

  pgadmin:
    image: dpage/pgadmin4@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
    ports:
    - 15433:80
    env_file:
    - .env
    depends_on:
    - database
    networks:
    - postgres-network

volumes:
  database:
    driver: local

networks:
  postgres-network:
    driver: bridge
