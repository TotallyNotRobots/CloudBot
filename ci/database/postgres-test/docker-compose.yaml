services:
  database:
    image: 'postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a'
    ports:
    - 15432:5432
    env_file:
    - .env
    networks:
    - postgres-network
    volumes:
    - database:/var/lib/postgresql/data/

  pgadmin:
    image: dpage/pgadmin4
    ports:
    - 15433:80
    env_file:
    - .env
    depends_on:
    - database
    networks:
    - postgres-network

volumes:
  database:
    driver: local

networks:
  postgres-network:
    driver: bridge
