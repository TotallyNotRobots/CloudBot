services:
  database:
    image: 'postgres:19@sha256:908d19593a1444b2d4e85783f718b16e0d40f1baf7518420475df9e5f5ac67a2'
    ports:
    - 15432:5432
    env_file:
    - .env
    networks:
    - postgres-network
    volumes:
    - database:/var/lib/postgresql/

  pgadmin:
    image: dpage/pgadmin4@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
    ports:
    - 15433:80
    env_file:
    - .env
    depends_on:
    - database
    networks:
    - postgres-network

volumes:
  database:
    driver: local

networks:
  postgres-network:
    driver: bridge
