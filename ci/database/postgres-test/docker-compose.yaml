services:
  database:
    image: 'postgres:17'
    ports:
    - 15432:5432
    env_file:
    - .env
    networks:
    - postgres-network
    volumes:
    - database:/var/lib/postgresql/data/

  pgadmin:
    image: dpage/pgadmin4
    ports:
    - 15433:80
    env_file:
    - .env
    depends_on:
    - database
    networks:
    - postgres-network

volumes:
  database:
    driver: local

networks:
  postgres-network:
    driver: bridge
