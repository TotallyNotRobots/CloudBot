services:
  database:
    image: 'postgres:19@sha256:aaa10f7ba7328b4a221a6c3184d83eef885bd16bf1f6de864757863156b0a4d1'
    ports:
    - 15432:5432
    env_file:
    - .env
    networks:
    - postgres-network
    volumes:
    - database:/var/lib/postgresql/

  pgadmin:
    image: dpage/pgadmin4@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
    ports:
    - 15433:80
    env_file:
    - .env
    depends_on:
    - database
    networks:
    - postgres-network

volumes:
  database:
    driver: local

networks:
  postgres-network:
    driver: bridge
