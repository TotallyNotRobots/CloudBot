[project]
name = "cloudbot"
requires-python = ">=3.10"
version = "1.5.0"

[tool.isort]
line_length = 80
known_first_party = ["cloudbot", "plugins", "tests"]
known_third_party = ["alembic"]
float_to_top = true
profile = "black"

[tool.black]
line-length = 80
include = '\.pyi?$'

[tool.mypy]
namespace_packages = true
python_version = "3.10"
warn_unused_configs = true
strict = false
strict_optional = true
ignore_missing_imports = true
check_untyped_defs = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
# strict_equality = true
plugins = ["pydantic.mypy"]
follow_imports = "silent"
# disallow_any_generics = true
no_implicit_reexport = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    # "explicit-override",
    "ignore-without-code",
    "mutable-override",
    # "possibly-undefined",
    # "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    # "unused-awaitable",
    "unused-ignore",
]

[[tool.mypy.overrides]]
module = 'cloudbot.*'
warn_return_any = true

[[tool.mypy.overrides]]
module = 'cloudbot.config'
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = 'cloudbot.util.*'
warn_return_any = true

[[tool.mypy.overrides]]
module = 'plugins.cryptocurrency'
warn_return_any = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.autoflake]
remove-all-unused-imports = true
in-place = true
expand-star-imports = true

[tool.pytest]
minversion = "9.0"
addopts = ["--doctest-modules"]
filterwarnings = ["error"]

[tool.pytest.ini_options]
addopts = [
    "--ignore=venv",
    "--ignore=.*",
    "--ignore=tools",
    "--ignore=alembic",
    "--cov=.",
    "--cov-report=xml",
    "--cov-report=html",
    "--doctest-modules",
    "--random-order",
    "--pythonhashseed=123",
]
testpaths = ["."]
filterwarnings = [
    "error",
    "ignore:.*asyncio\\.iscoroutinefunction.*:DeprecationWarning:mcstatus.*",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
minversion = "8.0"

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "@overload",
    "if TYPE_CHECKING:", # Type checking blocks are never accessible at test/runtime
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "class .*\\(.*(Error|Exception)\\):",
    "^ *\\.\\.\\.$",
    "raise ShouldBeUnreachable",
    "if __name__ == .__main__.:",
]

[tool.coverage.run]
branch = true
omit = [
    "tests/data/*",
    "tests/util/*",
    ".*", # Ignore any .cache, .venv, etc directories
    "venv/*",
    "tools/*", # Build/CI tools
    "alembic/*",
]
relative_files = true

[tool.nitpick]
style = [
    "gh://TotallyNotRobots/nitpick/app-style-3.10.toml",
]

[tool.flynt]
transform-concats = true
transform-joins = true
line-length = 120
aggressive = true

[tool.codespell]
skip = './data'
count = true
quiet-level = 3
ignore-words-list = ["cypher", "decypher", "AHD", "ahd", "astroid"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
ignore = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206", "ANN401", "ARG001", "ARG002", "ARG003", "ARG004", "ARG005", "ASYNC110", "ASYNC251", "B007", "B011", "B024", "B027", "B028", "B905", "BLE001", "C406", "C416", "C417", "C420", "C901", "COM812", "D", "D400", "D415", "DTZ", "E501", "E731", "E741", "EM101", "EM102", "ERA001", "FBT001", "FBT002", "FBT003", "FIX002", "FURB129", "FURB167", "FURB177", "FURB188", "I001", "INP001", "N802", "N806", "N818", "PERF102", "PERF203", "PERF401", "PIE808", "PIE810", "PLC0206", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR1730", "PLR2004", "PLR2044", "PLW1641", "PLW2901", "PLW3301", "PT001", "PT006", "PT007", "PT011", "PT015", "PT017", "PT018", "PT022", "PT023", "PTH103", "PTH120", "PTH123", "PTH201", "PTH208", "RET501", "RET502", "RET503", "RET504", "RSE102", "RUF005", "RUF006", "RUF022", "RUF023", "S101", "S105", "S113", "S310", "S311", "S603", "S606", "SIM102", "SIM103", "SIM105", "SIM108", "SIM110", "SIM114", "SIM115", "SIM118", "SIM201", "SLF001", "T201", "TD002", "TD003", "TD004", "TRY002", "TRY003", "TRY300", "TRY400", "CPY001", "ISC001", "EXE002"]
select = [
    "ALL",
]
extend-safe-fixes = ["TC", "UP", "RUF046"]
future-annotations = true
fixable = ["ALL"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "sqlalchemy.orm.DeclarativeBase", "cloudbot.util.database.Base"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
skip-magic-trailing-comma = true
[tool.alembic]
# path to migration scripts.
# this is typically a path given in POSIX (e.g. forward slashes)
# format, relative to the token %(here)s which refers to the location of this
# ini file
script_location = "%(here)s/alembic"
# additional paths to be prepended to sys.path. defaults to the current working directory.
prepend_sys_path = ["."]

# [[tool.alembic.post_write_hooks]]
# lint with attempts to fix using "ruff" - use the module runner, against the "ruff" module
# name = "ruff"
# type = "module"
# module = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# Alternatively, use the exec runner to execute a binary found on your PATH
# name = "ruff"
# type = "exec"
# executable = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"

[tool.basedpyright]
analyzeUnannotatedFunctions = true
reportUnusedCallResult = "none"
reportImplicitStringConcatenation = "none"
reportImportCycles = "none"
pythonVersion = "3.10"
